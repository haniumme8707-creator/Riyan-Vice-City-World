
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#090b12">
  <title>RIYAN — Vice City</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div id="loading-screen">
    <h1>RIYAN</h1>
    <p>VICE CITY</p>
    <span>LOADING YOUR WORLD...</span>
  </div>

  <main id="game">
    <section id="start-screen">
      <div class="start-content">
        <p class="eyebrow">A PERSONAL OPEN WORLD ADVENTURE</p>
        <h1>RIYAN</h1>
        <h2>VICE CITY</h2>
        <p class="tagline">Your city. Your rules. Your story.</p>
        <button id="start-button">ENTER GAME</button>
      </div>
    </section>

    <section id="game-screen" hidden>
      <div id="game-world"></div>

      <div id="game-hud">
        <div id="player-name">RIYAN</div>
        <div id="money">$0</div>
        <div id="mission-info">MISSION: Explore Vice City</div>
        <button id="map-button">MAP</button>
      </div>

      <div id="mobile-controls">
        <button id="run-button">RUN</button>
        <div id="joystick">
          <div id="joystick-knob"></div>
        </div>
        <button id="action-button">ACTION</button>
      </div>

      <div id="map-panel" hidden>
        <button id="close-map">CLOSE</button>
        <div id="map-content"></div>
      </div>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>

</body>
</html>
